<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060c0a" />
<title>HealthPilot — Lab Extraction &amp; LOINC Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="shell">
  <header class="header">
    <button class="btn btn-ghost btn-icon" id="navToggle" aria-label="Toggle reports list" title="Toggle reports list"></button>
    <div class="brand">
      <div class="mark">HP</div>
      <div class="brand-text"><b>HealthPilot</b><span>Lab extraction &amp; LOINC coding</span></div>
    </div>
    <div class="spacer"></div>
    <div class="stats" id="stats" aria-label="Summary"></div>
    <button class="btn btn-outline" id="lookupBtn" title="Search the LOINC terminology (Ctrl+K)"></button>
    <button class="btn btn-primary" id="uploadBtn"></button>
  </header>

  <div class="netbar" id="netBar" hidden></div>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Reports">
      <div class="side-head">
        <div class="side-title"><h2>Reports <span id="repCount"></span></h2></div>
        <div class="search" id="repSearchWrap"><input class="input" id="repSearch" type="search" placeholder="Search reports…" aria-label="Search reports" autocomplete="off" /></div>
        <div class="seg" id="repFilter" role="group" aria-label="Filter reports">
          <button data-f="all" aria-pressed="true">All</button>
          <button data-f="active" aria-pressed="false">Active</button>
          <button data-f="done" aria-pressed="false">Done</button>
          <button data-f="issues" aria-pressed="false">Issues</button>
        </div>
      </div>
      <div class="list" id="repList" role="list"></div>
    </aside>
    <div class="backdrop-nav" id="navBackdrop"></div>

    <main class="workspace" id="workspace">
      <section id="welcome" class="welcome"></section>

      <div class="ws-content" id="wsContent" hidden data-pane="results">
        <div class="ws-head">
          <div class="title">
            <span class="rep-ico" id="wsIco"></span>
            <div><h1 id="wsTitle"></h1><div class="proc-time" id="wsTime" hidden></div><div class="sub" id="wsSub"></div></div>
            <span id="wsStatus"></span>
          </div>
          <div class="ws-actions" id="wsActions"></div>
        </div>
        <div class="banners" id="banners"></div>
        <div class="pane-switch"><div class="seg" id="paneSwitch" role="tablist">
          <button data-pane="viewer" role="tab">Document</button>
          <button data-pane="results" role="tab" aria-selected="true">Results</button>
        </div></div>

        <div class="split" id="split">
          <section class="pane viewer" id="viewerPane" aria-label="Original document">
            <div class="pane-bar viewer-bar" id="viewerBar"></div>
            <div class="pane-body viewer-body" id="viewerBody" tabindex="0"></div>
          </section>
          <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize document and results panels"></div>
          <section class="pane results" id="resultsPane" aria-label="Extracted results">
            <div class="pane-bar">
              <div class="tabs" role="tablist" id="tabs">
                <button role="tab" data-tab="results" aria-selected="true">Results <span class="count" id="cntResults">0</span></button>
                <button role="tab" data-tab="fhir" aria-selected="false">FHIR</button>
              </div>
              <span style="margin-left:auto" id="resBarExtra"></span>
            </div>
            <div class="pane-body" id="resBody">
              <div id="resView">
                <div id="liveHost" hidden></div>
                <div class="so-far" id="soFar" hidden></div>
                <div id="resTools" hidden></div>
                <div id="addHost"></div>
                <div class="cards" id="cards"></div>
                <div id="resEmpty"></div>
              </div>
              <div id="fhirWrap" hidden>
                <div class="res-tools" style="justify-content:flex-end"><button class="btn btn-outline btn-sm" id="copyFhir"></button></div>
                <pre class="fhir" id="fhirView"></pre>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
