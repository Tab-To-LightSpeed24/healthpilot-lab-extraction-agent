databases:
  - name: healthpilot-db
    plan: free
    databaseName: healthpilot
    user: healthpilot

services:
  - type: web
    name: healthpilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthpilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: MAPPING_CONFIDENCE_THRESHOLD
        value: "0.75"
