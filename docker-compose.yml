services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthpilot
      POSTGRES_PASSWORD: healthpilot
      POSTGRES_DB: healthpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://healthpilot:healthpilot@db:5432/healthpilot
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      API_KEY: ${API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
